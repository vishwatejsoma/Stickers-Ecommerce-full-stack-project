spring.application.name=Stickers-Ecommerce
server.port = 9092

spring.application.name=Stickers-Backend


logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

#/h2-console
spring.h2.console.enabled=true
#spring.datasource.url=jdbc:h2:mem:productsdb
spring.datasource.url=jdbc:h2:file:~/productshop;AUTO_SERVER=true
spring.datasource.username=user
spring.datasource.password=user
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=embedded
spring.sql.init.schema-locations=optional:classpath:sql/schema.sql
spring.sql.init.data-locations=optional:classpath:sql/data.sql
spring.jpa.show-sql=true